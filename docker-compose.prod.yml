# Production overrides: HTTPS on 443 with Let's Encrypt, nothing but nginx exposed.
# Use: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
      - ./deploy/certbot/www:/var/www/certbot:ro

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - ./deploy/certbot/conf:/etc/letsencrypt
      - ./deploy/certbot/www:/var/www/certbot
    # try to renew twice a day; certbot only renews when < 30 days remain
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]
    networks: [backend]

  api-1:
    environment:
      SEED_DEMO: ${SEED_DEMO:-false}
