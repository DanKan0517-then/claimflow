# Render Blueprint: the public demo deployment (free tier, Singapore).
#   browser -> claimflow (nginx + React) -> claimflow-api (Spring Boot) -> Postgres + Key Value (Redis)
# Free web services can't receive private-network traffic, so nginx proxies to the API's public HTTPS URL.

databases:
  - name: claimflow-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: claimflow_db
    user: claimflow_db_user

services:
  - type: keyvalue
    name: claimflow-redis
    plan: free
    region: singapore
    maxmemoryPolicy: noeviction
    ipAllowList: []   # internal connections only

  - type: web
    name: claimflow-api
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: DB_HOST
        fromDatabase: { name: claimflow-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: claimflow-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: claimflow-db, property: database }
      - key: DATABASE_USER
        fromDatabase: { name: claimflow-db, property: user }
      - key: DATABASE_PASSWORD
        fromDatabase: { name: claimflow-db, property: password }
      - key: REDIS_HOST
        fromService: { type: keyvalue, name: claimflow-redis, property: host }
      - key: REDIS_PORT
        fromService: { type: keyvalue, name: claimflow-redis, property: port }
      - key: JWT_SECRET
        generateValue: true
      - key: SERVER_PORT
        value: "10000"
      - key: INSTANCE_ID
        value: render-api
      - key: SEED_DEMO
        value: "true"
      - key: DB_POOL_SIZE
        value: "5"
      - key: CORS_ORIGINS
        value: https://claimflow-v9sw.onrender.com
      # 512 MB free instance: small heap, serial GC, faster JIT warm-up
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=60 -XX:+UseSerialGC -Xss512k -XX:MaxMetaspaceSize=160m -XX:TieredStopAtLevel=1 -XX:+ExitOnOutOfMemoryError

  - type: web
    name: claimflow
    runtime: docker
    plan: free
    region: singapore
    dockerContext: .
    dockerfilePath: ./nginx/Dockerfile.render
    healthCheckPath: /nginx-health
    envVars:
      - key: API_HOST
        value: claimflow-api-ic4a.onrender.com
      - key: API_RATE_LIMIT
        value: "30"
