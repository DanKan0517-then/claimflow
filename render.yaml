# Render Blueprint: the public demo (free tier, Singapore).
#   browser -> claimflow [ nginx -> Spring Boot API (same container) ] -> Postgres + Key Value (Redis)
# nginx and the API share one container on purpose: free services sleep when idle, and a single
# service wakes up as one unit on the first request (two services would each need waking).
# Production (docker-compose.yml) runs them as separate containers with two API replicas.

databases:
  - name: claimflow-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: claimflow_db
    user: claimflow_db_user

services:
  - type: keyvalue
    name: claimflow-redis
    plan: free
    region: singapore
    maxmemoryPolicy: noeviction
    ipAllowList: []   # internal connections only

  - type: web
    name: claimflow
    runtime: docker
    plan: free
    region: singapore
    dockerContext: .
    dockerfilePath: ./Dockerfile.render
    healthCheckPath: /healthz
    envVars:
      - key: DB_HOST
        fromDatabase: { name: claimflow-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: claimflow-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: claimflow-db, property: database }
      - key: DATABASE_USER
        fromDatabase: { name: claimflow-db, property: user }
      - key: DATABASE_PASSWORD
        fromDatabase: { name: claimflow-db, property: password }
      - key: REDIS_HOST
        fromService: { type: keyvalue, name: claimflow-redis, property: host }
      - key: REDIS_PORT
        fromService: { type: keyvalue, name: claimflow-redis, property: port }
      - key: JWT_SECRET
        generateValue: true
      - key: INSTANCE_ID
        value: render
      - key: SEED_DEMO
        value: "true"
      - key: DB_POOL_SIZE
        value: "5"
      - key: CORS_ORIGINS
        value: https://claimflow-v9sw.onrender.com
      - key: API_RATE_LIMIT
        value: "30"
