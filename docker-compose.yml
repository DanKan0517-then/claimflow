# Full ClaimFlow system on one machine:
#   nginx (gateway, TLS, static React) -> 2x Spring Boot API replicas -> Postgres + Redis
#   Prometheus scrapes both replicas, Grafana shows the dashboards.
# Run:  cp .env.example .env && docker compose up -d --build

x-api: &api
  build: ./backend
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  environment: &api-env
    DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-claimflow}
    DATABASE_USER: ${POSTGRES_USER:-claimflow}
    DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-claimflow}
    REDIS_HOST: redis
    REDIS_PASSWORD: ${REDIS_PASSWORD:-claimflow-redis}
    JWT_SECRET: ${JWT_SECRET:-local-dev-secret-local-dev-secret-local-dev-secret}
    CORS_ORIGINS: ${PUBLIC_URL:-http://localhost},http://localhost:5173
    GROQ_API_KEY: ${GROQ_API_KEY:-}
    GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
    MANAGER_APPROVAL_THRESHOLD: ${MANAGER_APPROVAL_THRESHOLD:-50000}
    HIGH_RISK_FRAUD_SCORE: ${HIGH_RISK_FRAUD_SCORE:-70}
    UPLOAD_DIR: /data/uploads
    JAVA_OPTS: -XX:MaxRAMPercentage=70 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError
  volumes:
    - uploads:/data/uploads        # shared by both replicas
  networks: [backend]
  deploy:
    resources:
      limits: { memory: 768m }

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-claimflow}
      POSTGRES_USER: ${POSTGRES_USER:-claimflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-claimflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-claimflow-redis}", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-claimflow-redis}
    networks: [backend]

  api-1:
    <<: *api
    environment:
      <<: *api-env
      INSTANCE_ID: api-1
      SEED_DEMO: ${SEED_DEMO:-true}   # only one replica seeds, to avoid a race

  api-2:
    <<: *api
    environment:
      <<: *api-env
      INSTANCE_ID: api-2
      SEED_DEMO: "false"

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    depends_on:
      api-1: { condition: service_healthy }
      api-2: { condition: service_healthy }
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}
      API_RATE_LIMIT: ${API_RATE_LIMIT:-30}
    ports:
      - "${HTTP_PORT:-80}:80"
    networks: [backend]

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [backend]

  grafana:
    image: grafana/grafana:11.2.2
    restart: unless-stopped
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks: [backend]

volumes:
  pgdata:
  redisdata:
  uploads:
  promdata:
  grafanadata:

networks:
  backend:
