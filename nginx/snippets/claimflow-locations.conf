root /usr/share/nginx/html;
client_max_body_size 12m;
server_tokens off;
limit_conn conn_limit 50;

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript image/svg+xml;

include /etc/nginx/snippets/security-headers.conf;

location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# Management endpoints are scraped by Prometheus on the internal network, never exposed publicly.
location /actuator/ {
    return 404;
}

location /api/auth/ {
    limit_req zone=auth_limit burst=10 nodelay;
    include /etc/nginx/snippets/proxy.conf;
}

location ~ ^/api/claims/\d+/documents$ {
    limit_req zone=upload_limit burst=10 nodelay;
    include /etc/nginx/snippets/proxy.conf;
}

location /api/ {
    limit_req zone=api_limit burst=60 nodelay;
    include /etc/nginx/snippets/proxy.conf;
}

# Swagger UI assets for /api/docs
location ~ ^/(swagger-ui|v3/api-docs)/ {
    include /etc/nginx/snippets/proxy.conf;
}

# WebSocket for live claim updates. Long read timeout; client pings every 25s.
location /ws {
    proxy_pass http://claimflow_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}

# Vite puts a content hash in every asset name, so they can be cached forever.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
}

# React single-page app: unknown paths fall back to index.html, which is never cached.
location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
}
